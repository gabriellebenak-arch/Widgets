<!DOCTYPE html>
<html lang="en">
<head>
<!-- Staffbase brand color via ?brand= URL param (sb-brand-url-param) -->
<script>(function(){try{var b=new URLSearchParams(location.search).get('brand');if(b&&/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(b)){document.documentElement.style.setProperty('--sb-brand',b);}}catch(e){}})();</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="widget-name" content="My Payslips">
<meta name="widget-description" content="View pay history, net pay, gross pay, and deductions for each pay period.">
<meta name="widget-tags" content="Finance, HR Data">
<title>My Payslips</title>

<style>
    :root {
        --primary: var(--sb-brand, #191970);
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #1f2937;
        --text-light: #6b7280;
        --bg: #ffffff;
        --bg-gray: #f9fafb;
        --border: #e5e7eb;
        /* Forest green for money figures — darker/less glare-y than --success */
        --money: #166534;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            /* Widget is designed to always sit on a white surface, so the
               background and text stay in the light palette even in dark mode. */
            --primary: var(--sb-brand, #191970);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg: #ffffff;
            --bg-gray: #f9fafb;
            --border: #e5e7eb;
            --money: #166534;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }

    .widget {
        position: relative;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        background: var(--bg);
        border-radius: 14px;
        padding: 16px;
        overflow-x: hidden;
    }

    .widget h2 {
        margin: 0 0 10px 0;
        font-size: clamp(17px, 5vw, 20px);
        letter-spacing: -0.01em;
    }

    /* --- Privacy toggle --- */
    .privacy-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        background: none;
        border: none;
        padding: 0;
        margin: 0 0 16px 0;
        cursor: pointer;
        font-family: inherit;
    }
    .privacy-icon-circle {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid var(--primary);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .privacy-icon-circle svg { width: 14px; height: 14px; }
    .privacy-label {
        color: var(--primary);
        font-size: 14px;
        font-weight: 600;
    }

    /* --- Full privacy screen (blur + centered "tap to view") --- */
    .privacy-content { transition: filter 0.2s ease; }
    .widget.private .privacy-content {
        filter: blur(7px);
        pointer-events: none;
        user-select: none;
    }

    .privacy-overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
        padding: 24px;
        border: none;
        border-radius: 14px;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        z-index: 5;
    }
    .widget.private .privacy-overlay { display: flex; }

    .privacy-overlay-text {
        font-size: clamp(20px, 6vw, 26px);
        font-weight: 700;
        color: var(--text);
        line-height: 1.25;
    }
    .privacy-eye-btn {
        flex: 0 0 auto;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 2px solid var(--primary);
        background: var(--bg);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .privacy-eye-btn svg { width: 28px; height: 28px; }
    .privacy-overlay:hover .privacy-eye-btn { filter: brightness(0.97); }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    /* --- Period tabs --- */
    .cw-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 10px;
        margin-bottom: 16px;
        -webkit-overflow-scrolling: touch;
    }
    .cw-tabs::-webkit-scrollbar { height: 4px; }
    .cw-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cw-tab {
        flex: 0 0 auto;
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
    }
    .cw-tab.active {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--bg-gray);
    }

    /* --- Summary card --- */
    .summary-card {
        background: var(--bg-gray);
        border-radius: 12px;
        padding: clamp(14px, 4vw, 20px);
        margin-bottom: 20px;
    }

    .net-pay-block {
        text-align: center;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 16px;
    }

    .cw-icon-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--text-light);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        margin: 0 auto 8px;
    }

    .cw-stat-label {
        font-size: 13px;
        color: var(--text-light);
        margin-bottom: 4px;
    }

    .net-pay-amount {
        font-size: clamp(22px, 7vw, 28px);
        font-weight: 700;
        color: var(--money);
    }

    .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }
    .summary-col { text-align: center; padding: 0 8px; min-width: 0; }
    .summary-col:first-child { border-right: 1px solid var(--border); }
    .summary-value {
        font-size: clamp(14px, 4vw, 16px);
        font-weight: 700;
        color: var(--text);
        overflow-wrap: break-word;
    }

    /* --- Payslip list --- */
    .cw-section-title {
        font-size: 15px;
        font-weight: 700;
        margin: 0 0 10px 2px;
    }

    .payslip-list { display: flex; flex-direction: column; gap: 8px; }

    .payslip-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-gray);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        border: none;
        width: 100%;
        text-align: left;
        font-family: inherit;
        color: inherit;
    }
    .payslip-row:hover { filter: brightness(0.97); }

    .payslip-icon { flex: 0 0 auto; width: 26px; height: 26px; }
    .payslip-date {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        color: var(--text);
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .payslip-amount { flex: 0 0 auto; font-size: 15px; font-weight: 700; color: var(--money); }
    .payslip-chevron { flex: 0 0 auto; width: 16px; height: 16px; color: var(--text-light); }

    /* --- Modal --- */
    .cw-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.15s ease;
    }
    .cw-modal-overlay.open { opacity: 1; visibility: visible; }

    .cw-modal {
        background: var(--bg);
        border-radius: 14px;
        width: calc(100% - 32px);
        max-width: 440px;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .cw-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
        font-size: clamp(15px, 4vw, 16px);
    }

    .cw-modal-close {
        background: none;
        border: none;
        font-size: 22px;
        line-height: 1;
        color: var(--text-light);
        cursor: pointer;
        padding: 0 4px;
    }

    .cw-modal-body { padding: 16px; overflow-y: auto; flex: 1; }

    .cw-banner {
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 10px;
        display: flex;
        gap: 8px;
        align-items: flex-start;
    }
    .cw-banner-info { background: #eff6ff; color: #1d4ed8; }
    .cw-banner-warning { background: #fffbeb; color: #92400e; }

    .modal-summary-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        padding: 6px 0 16px;
    }
    .modal-net-pay { font-size: clamp(19px, 6vw, 22px); font-weight: 700; color: var(--money); }
    .modal-pay-period { font-size: clamp(13px, 4vw, 15px); font-weight: 700; color: var(--text); text-align: right; }

    .cw-table-wrap { width: 100%; overflow-x: auto; margin-bottom: 16px; }
    .cw-table { width: 100%; min-width: 320px; border-collapse: collapse; font-size: clamp(12.5px, 3.6vw, 14px); }
    .cw-table th {
        text-align: left;
        background: var(--bg-gray);
        padding: 8px 10px;
        font-size: 12px;
        color: var(--text-light);
        font-weight: 600;
        white-space: nowrap;
    }
    .cw-table th:last-child, .cw-table td:last-child { text-align: right; }
    .cw-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .cw-table tr.total-row td { font-weight: 700; color: var(--money); border-bottom: none; }

    .cw-modal-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
    }
    .cw-modal-footer .cw-btn { width: auto; padding: 10px 20px; }

    .cw-btn {
        padding: 12px 14px;
        font-size: 15px;
        border-radius: 8px;
        background: var(--primary);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        width: 100%;
    }
    .cw-btn:hover { filter: brightness(0.93); }

    /* --- Small-screen tightening --- */
    @media (max-width: 360px) {
        .widget { padding: 12px; }
        .summary-col { padding: 0 4px; }
        .cw-icon-circle { width: 34px; height: 34px; font-size: 16px; }
        .cw-modal-header, .cw-modal-body, .cw-modal-footer { padding-left: 12px; padding-right: 12px; }
    }
</style>

<div class="widget" id="widget">

        <h2 data-i18n="title"></h2>

        <button type="button" class="privacy-toggle" id="privacyToggle">

            <span class="privacy-label" id="privacyLabel"></span>
        </button>

        <div class="cw-tabs" id="periodTabs"></div>

        <div class="summary-card">
            <div class="net-pay-block">
                <div class="cw-icon-circle" aria-hidden="true">$</div>
                <div class="cw-stat-label" data-i18n="netPay"></div>

            <div class="summary-grid">
                <div class="summary-col">

</div>

<div class="cw-modal-overlay" id="modalOverlay">

                <div>

        <div class="cw-modal-footer">

        'en-US': {

            tapToHide: "Tap to hide",
            tapToView: "Tap to view your payslips",

            close: "Close",
            privateNotice: "This information is only visible to you.",
            unofficialNotice: "This is only a summary of your payslip. It's not official.",
            payPeriod: "Pay Period",
            earnings: "Earnings",

            amount: "Amount",

    const t = T[LANG] ?? T['en-US'];

    const DEDUCTION_LABEL_KEY = {
        fedTax: 'ded_fedTax', stateTax: 'ded_stateTax', socSec: 'ded_socSec',
        medicare: 'ded_medicare', k401: 'ded_401k', medical: 'ded_medical',
        dental: 'ded_dental', vision: 'ded_vision', parking: 'ded_parking', transit: 'ded_transit'
    };

    // --- Privacy screen (blurs the whole widget; hidden by default) ---
    const EYE_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>' +
        '</svg>';
    const EYE_SLASH_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.94"/>' +
            '<path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a18.6 18.6 0 0 1-2.16 3.19"/>' +
            '<path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>' +
        '</svg>';

    // Data is private by default; the whole widget is blurred behind the overlay.
    let dataHidden = true;

    // Amounts are always the real value — privacy is handled by the CSS blur, not by masking.
    function money(amount) {
        return currencyFormatter.format(amount);
    }

    function updatePrivacyState() {
        document.getElementById('widget').classList.toggle('private', dataHidden);
        // Top toggle only appears when data is visible — it always offers "hide".
        document.getElementById('privacyIcon').innerHTML = EYE_SLASH_SVG;
        document.getElementById('privacyLabel').textContent = t.tapToHide;
        document.getElementById('privacyEye').innerHTML = EYE_SVG;
    }

    // --- Staffbase brand color passthrough ---
    function applySBBrand() {
        var sb = getComputedStyle(document.documentElement).getPropertyValue('--sb-brand').trim();
        if (sb) {
            document.documentElement.style.setProperty('--primary', sb);
            return;
        }
        try {
            sb = window.parent.getComputedStyle(window.parent.document.documentElement)
                    .getPropertyValue('--sb-brand').trim();
            if (sb) document.documentElement.style.setProperty('--primary', sb);
        } catch (e) { /* cross-origin, ignore */ }
    }

    function applyTranslations() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (t[key] !== undefined) el.textContent = t[key];
        });
    }

    // --- Mock payslip data (never hardcode dates — anchor to "now") ---
    function round2(n) { return Math.round(n * 100) / 100; }

    const FIXED_BENEFITS = [
        { code: 'medical', amount: 87.84 },
        { code: 'dental', amount: 14.50 },
        { code: 'vision', amount: 18.50 },
        { code: 'parking', amount: 25.00 },
        { code: 'transit', amount: 12.50 },
    ];
    const FIXED_TOTAL = round2(FIXED_BENEFITS.reduce((s, b) => s + b.amount, 0));

    function buildDeductions(gross, net) {
        const totalDed = round2(gross - net);
        const socSec = round2(gross * 0.062);
        const medicare = round2(gross * 0.0145);
        const k401 = round2(gross * 0.06);
        const stateTax = round2(gross * 0.05);
        const nonFed = round2(socSec + medicare + k401 + stateTax + FIXED_TOTAL);
        const fedTax = round2(totalDed - nonFed);
        return [
            { code: 'fedTax', amount: fedTax },
            { code: 'stateTax', amount: stateTax },
            { code: 'socSec', amount: socSec },
            { code: 'medicare', amount: medicare },
            { code: 'k401', amount: k401 },
            ...FIXED_BENEFITS,
        ];
    }

    const now = new Date();
    function mostRecentPayDate(base) {
        const d = new Date(base.getFullYear(), base.getMonth(), 15);
        if (d > base) d.setMonth(d.getMonth() - 1);
        return d;
    }
    const latestPayDate = mostRecentPayDate(now);

    // Index 0 = most recent pay period; index 11 = 11 months earlier.
    const PAY_DATA = [
        { gross: 6225.63, net: 4162.72 },
        { gross: 6142.85, net: 4103.50 },
        { gross: 6301.20, net: 4213.90 },
        { gross: 6058.40, net: 4046.60 },
        { gross: 6020.15, net: 4020.85 },
        { gross: 5985.40, net: 3998.10 },
        { gross: 6110.75, net: 4083.20 },
        { gross: 5950.30, net: 3975.05 },
        { gross: 5920.60, net: 3954.90 },
        { gross: 5890.25, net: 3934.15 },
        { gross: 5875.80, net: 3924.30 },
        { gross: 5850.00, net: 3907.50 },
    ];

    const periods = PAY_DATA.map((d, i) => {
        const payDate = new Date(latestPayDate.getFullYear(), latestPayDate.getMonth() - i, 15);
        const periodStart = new Date(payDate.getFullYear(), payDate.getMonth(), 1);
        const periodEnd = new Date(payDate.getFullYear(), payDate.getMonth(), 15);
        return {
            payDate, periodStart, periodEnd,
            gross: d.gross, net: d.net,
            deductions: buildDeductions(d.gross, d.net),
        };
    });

    let selectedIndex = 0;

    // --- Rendering ---
    function renderTabs() {
        const el = document.getElementById('periodTabs');
        el.innerHTML = '';
        periods.forEach((p, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cw-tab' + (i === selectedIndex ? ' active' : '');
            btn.textContent = monthYearFormatter.format(p.payDate);
            btn.addEventListener('click', () => {
                selectedIndex = i;
                renderTabs();
                renderPeriod();
            });
            el.appendChild(btn);
        });
    }

    function renderPeriod() {
        const p = periods[selectedIndex];
        document.getElementById('netPayAmount').innerHTML = money(p.net);
        document.getElementById('grossPayAmount').innerHTML = money(p.gross);
        document.getElementById('deductionsAmount').innerHTML = money(round2(p.gross - p.net));
        renderPayslipList();
    }

    function renderPayslipList() {
        const p = periods[selectedIndex];
        const list = document.getElementById('payslipList');
        list.innerHTML = '';
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'payslip-row';
        row.innerHTML =
            '<svg class="payslip-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#fdece7" stroke="#e2664e" stroke-width="1.3"/>' +
                '<path d="M15 2v5h5" stroke="#e2664e" stroke-width="1.3" fill="none"/>' +
            '</svg>' +
            '<span class="payslip-date">' + dateFormatter.format(p.payDate) + '</span>' +
            '<span class="payslip-amount">' + money(p.net) + '</span>' +
            '<svg class="payslip-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>';
        row.addEventListener('click', () => openModal(p));
        list.appendChild(row);
    }

    let openPeriod = null;

    function openModal(p) {
        openPeriod = p;
        document.getElementById('modalNetPay').innerHTML = money(p.net);
        document.getElementById('modalPayPeriod').textContent =
            dateFormatter.format(p.periodStart) + ' - ' + dateFormatter.format(p.periodEnd);

        document.getElementById('earningsBody').innerHTML =
            '<tr><td>' + t.earn_base + '</td><td>' + money(p.gross) + '</td></tr>' +
            '<tr class="total-row"><td>' + t.total + '</td><td>' + money(p.gross) + '</td></tr>';

        document.getElementById('deductionsBody').innerHTML =
            p.deductions.map(d =>
                '<tr><td>' + t[DEDUCTION_LABEL_KEY[d.code]] + '</td><td>' + money(d.amount) + '</td></tr>'
            ).join('') +
            '<tr class="total-row"><td>' + t.total + '</td><td>' + money(round2(p.gross - p.net)) + '</td></tr>';

        document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('open');
    }

    function setPrivacy(hidden) {
        dataHidden = hidden;
        // Re-hiding while the detail modal is open would leak figures — close it first.
        if (hidden) closeModal();
        updatePrivacyState();
    }

    document.addEventListener('DOMContentLoaded', () => {
        applySBBrand();
        applyTranslations();
        updatePrivacyState();
        renderTabs();
        renderPeriod();
        document.getElementById('privacyOverlay').addEventListener('click', () => setPrivacy(false));
        document.getElementById('privacyToggle').addEventListener('click', () => setPrivacy(true));
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });
    });
</script>
